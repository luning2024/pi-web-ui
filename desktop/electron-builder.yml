# electron-builder 配置（桌面版专用，网页版/npm 包不受影响）
appId: com.sfwgo.pi-desktop
productName: pi-desktop
directories:
  output: release
files:
  - bin
  - dist/desktop
  - dist/server
  - web/dist
  - themes
  - plugin-sdk
  - plugins/catalog.json
  - package.json
# 仓库 package.json 的 main 是 CLI（bin/pi-web-ui.mjs，供插件安装器等子进程调用）：
# 桌面壳主进程入口必须是 dist/desktop/main.js，故通过 extraMetadata 覆写 main。
extraMetadata:
  main: dist/desktop/main.js
  # 让 Electron 的 userData 落到 %APPDATA%\pi-desktop，不与上游桌面版共用 pi-web-ui
  name: pi-desktop
# asar:false：server 以 ELECTRON_RUN_AS_NODE 跑在纯 Node 语义下，
# 且 node-pty 的 .node 原生模块本来就进不了 asar，直接关闭最省心。
asar: false
# 关掉 electron-builder 的 @electron/rebuild：node-pty 1.1.0 是 N-API 预编译
# （prebuilds/，在 ELECTRON_RUN_AS_NODE 下实测 require 成功，ABI 141/149 通吃），
# 不需要按 Electron ABI 重编；否则打包时会强依赖本机 Visual Studio（node-gyp）。
npmRebuild: false
# 图标：直接复用网页版的 PWA 图标（1024×1024 PNG，electron-builder 自己转 .ico/.icns）。
# 不放进 files：图标是打包时烘进 exe/App 里的，运行时不需要这个文件。
# 更新 feed：本构建**不接**上游 feed —— 否则 electron-updater 会把应用原地升回
# 官方 pi-web-ui，品牌被覆盖。不声明 publish 就不生成 app-update.yml，自动更新停用；
# 升级 = 拉源码 + 重打。
win:
  target:
    - nsis
    - dir
  icon: web/public/icons/icon-1024.png
mac:
  # dmg 给人手装，zip 给 electron-updater 原地更新（Squirrel.Mac 只吃 zip，
  # issue #180A：以前只有 dmg，latest-mac.yml 即使接上 updater 也生效不了）。
  target:
    - dmg
    - zip
  icon: web/public/icons/icon-1024.png
linux:
  target: AppImage
  icon: web/public/icons/icon-1024.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 去空格（issue #180B）：默认产物名 `${productName} Setup ${version}.exe`
  # 带空格，GitHub 把 asset 名里的空格转成点，feed 里的 url 随即 404。
  # 显式无空格名让 latest.yml 与实际 asset 名天然一致。
  artifactName: ${productName}-${version}-setup.${ext}
# 签名：不写死任何证书路径——electron-builder 认 CSC_LINK + CSC_KEY_PASSWORD 环境变量，
# 有证书时自动签（含 mac 的 .p12），没有就出未签名包（Windows SmartScreen 会提示未知发布者）。
# 详见 desktop/README.md「签名」。
